<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos - IAprende</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px 60px;
        }

        .top-bar {
            max-width: 1100px;
            margin: 0 auto 30px;
        }

        .header-titles h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .header-titles p {
            margin: 5px 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .tarjeta-wrapper {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .tarjeta-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.14);
        }

        .tarjeta-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .tarjeta-link img {
            width: 100%;
            height: 185px;
            object-fit: cover;
            display: block;
            background-color: #e2e8f0;
        }

        .info-curso {
            padding: 20px;
            flex-grow: 1;
        }

        .info-curso h3 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
        }

        .info-curso p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.45;
        }

        .status-msg {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="header-titles">
            <h1>Catálogo de Cursos</h1>
            <p>Selecciona un curso para acceder a su plataforma</p>
        </div>
    </div>

    <div class="catalogo" id="catalogoContainer">
        <div class="status-msg" id="msgCarga">Cargando cursos...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getFirestore, collection, onSnapshot, query, orderBy
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDP3tRt4ulRkco5x5U7lT2nDbU22YAsglU",
            authDomain: "iaprende-2be7b.firebaseapp.com",
            projectId: "iaprende-2be7b",
            storageBucket: "iaprende-2be7b.firebasestorage.app",
            messagingSenderId: "748124476504",
            appId: "1:748124476504:web:55d8c5f290890db343662d"
        };

        const catalogoContainer = document.getElementById("catalogoContainer");

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);

            const cursosRef = collection(db, "cursos");
            const q = query(cursosRef, orderBy("creado", "asc"));

            onSnapshot(q, (snapshot) => {
                catalogoContainer.innerHTML = "";

                if (snapshot.empty) {
                    catalogoContainer.innerHTML = `
                        <div class="status-msg">
                            Por el momento no hay cursos disponibles.
                        </div>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const curso = docSnap.data();

                    const card = document.createElement("div");
                    card.className = "tarjeta-wrapper";
                    card.innerHTML = `
                        <a href="${curso.enlace}" target="_blank" rel="noopener noreferrer" class="tarjeta-link">
                            <img src="${curso.imagen || 'https://via.placeholder.com/600x350?text=Sin+Portada'}" alt="${curso.titulo}">
                            <div class="info-curso">
                                <h3>${curso.titulo}</h3>
                                <p>${curso.descripcion}</p>
                            </div>
                        </a>
                    `;

                    catalogoContainer.appendChild(card);
                });
            }, (error) => {
                console.error("Error al cargar cursos desde Firestore:", error);
                catalogoContainer.innerHTML = `
                    <div class="status-msg" style="color: #ef4444;">
                        No se pudieron cargar los cursos en este momento.
                    </div>`;
            });
        } catch (error) {
            console.error("Error al inicializar Firebase:", error);
            catalogoContainer.innerHTML = `
                <div class="status-msg" style="color: #ef4444;">
                    Error al conectar con el catálogo.
                </div>`;
        }
    </script>
</body>
</html>
