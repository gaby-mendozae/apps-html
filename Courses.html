<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Cursos - IAprende</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px 60px;
        }

        .top-bar {
            max-width: 1100px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-titles h1 { margin: 0; font-size: 1.8rem; }
        .header-titles p { margin: 5px 0 0; color: var(--text-muted); font-size: 0.95rem; }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1; transition: .3s; border-radius: 24px;
        }

        .slider:before {
            position: absolute; content: "";
            height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        .admin-controls {
            max-width: 1100px;
            margin: 0 auto 25px;
            display: none;
            justify-content: flex-end;
        }

        body.edit-mode .admin-controls { display: flex; }

        .btn {
            background-color: var(--primary); color: white; border: none;
            padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: background 0.2s; font-size: 0.95rem;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-secondary { background-color: #e2e8f0; color: #334155; }
        .btn-secondary:hover { background-color: #cbd5e1; }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .tarjeta-wrapper {
            position: relative;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .tarjeta-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.14);
        }

        .tarjeta-link {
            text-decoration: none; color: inherit;
            display: flex; flex-direction: column; flex-grow: 1;
        }

        .tarjeta-link img {
            width: 100%; height: 185px; object-fit: cover; display: block; background-color: #e2e8f0;
        }

        .info-curso { padding: 20px; flex-grow: 1; }
        .info-curso h3 { margin: 0 0 8px 0; font-size: 1.2rem; }
        .info-curso p { margin: 0; font-size: 0.9rem; color: var(--text-muted); line-height: 1.45; }

        .card-actions {
            display: none; padding: 12px 20px; background: #f8fafc;
            border-top: 1px solid #e2e8f0; gap: 10px; justify-content: flex-end;
        }

        body.edit-mode .card-actions { display: flex; }
        .card-actions button { padding: 6px 12px; font-size: 0.85rem; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6); display: none;
            align-items: center; justify-content: center; padding: 20px; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: white; width: 100%; max-width: 460px;
            border-radius: 14px; padding: 25px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }
        .modal h2 { margin: 0 0 20px; font-size: 1.35rem; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        .form-group input[type="text"],
        .form-group input[type="url"],
        .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1;
            border-radius: 8px; font-family: inherit; font-size: 0.95rem; box-sizing: border-box;
        }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
        .status-msg { text-align: center; color: var(--text-muted); grid-column: 1 / -1; padding: 40px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="header-titles">
            <h1>Catálogo de Cursos</h1>
            <p>Selecciona un curso para acceder a su plataforma</p>
        </div>

        <div class="switch-container">
            <span style="font-size: 0.9rem; font-weight: 600;">Modo Edición</span>
            <label class="switch">
                <input type="checkbox" id="editSwitch">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="admin-controls">
        <button class="btn" id="btnNuevoCurso">+ Agregar Nuevo Curso</button>
    </div>

    <div class="catalogo" id="catalogoContainer">
        <div class="status-msg" id="msgCarga">Conectando con Firestore...</div>
    </div>

    <!-- Modal Formulario -->
    <div class="modal-overlay" id="modalCurso">
        <div class="modal">
            <h2 id="modalTitle">Agregar Curso</h2>
            <form id="formCurso">
                <input type="hidden" id="cursoId">
                <input type="hidden" id="imagenActualUrl">

                <div class="form-group">
                    <label for="titulo">Título del Curso</label>
                    <input type="text" id="titulo" required placeholder="Ej. Auditoría de Sistemas">
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción breve</label>
                    <textarea id="descripcion" rows="2" required placeholder="De qué trata el curso..."></textarea>
                </div>

                <div class="form-group">
                    <label for="enlace">URL de destino (al hacer clic)</label>
                    <input type="url" id="enlace" required placeholder="https://...">
                </div>

                <div class="form-group">
                    <label for="fotoUrlManual">URL directa de la imagen</label>
                    <input type="url" id="fotoUrlManual" required placeholder="https://ejemplo.com/imagen.jpg">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn" id="btnGuardar">Guardar Curso</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script con tu configuración oficial de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Tus credenciales exactas
        const firebaseConfig = {
            apiKey: "AIzaSyDP3tRt4ulRkco5x5U7lT2nDbU22YAsglU",
            authDomain: "iaprende-2be7b.firebaseapp.com",
            projectId: "iaprende-2be7b",
            storageBucket: "iaprende-2be7b.firebasestorage.app",
            messagingSenderId: "748124476504",
            appId: "1:748124476504:web:55d8c5f290890db343662d"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("Firebase conectado correctamente");
        } catch (error) {
            console.error("Error al inicializar Firebase:", error);
            document.getElementById('msgCarga').innerHTML = `<span style="color: red;">Error al iniciar Firebase.</span>`;
        }

        const editSwitch = document.getElementById('editSwitch');
        const catalogoContainer = document.getElementById('catalogoContainer');
        const btnNuevoCurso = document.getElementById('btnNuevoCurso');
        const modalCurso = document.getElementById('modalCurso');
        const btnCancelar = document.getElementById('btnCancelar');
        const formCurso = document.getElementById('formCurso');
        const btnGuardar = document.getElementById('btnGuardar');

        editSwitch.addEventListener('change', (e) => {
            document.body.classList.toggle('edit-mode', e.target.checked);
        });

        if (db) {
            const cursosRef = collection(db, "cursos");
            const q = query(cursosRef, orderBy("creado", "asc"));
            
            onSnapshot(q, (snapshot) => {
                catalogoContainer.innerHTML = "";

                if (snapshot.empty) {
                    catalogoContainer.innerHTML = `
                        <div class="status-msg">
                            Aún no hay cursos. Activa el <strong>Modo Edición</strong> arriba para agregar el primero.
                        </div>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const curso = docSnap.data();
                    const id = docSnap.id;

                    const card = document.createElement('div');
                    card.className = 'tarjeta-wrapper';
                    card.innerHTML = `
                        <a href="${curso.enlace}" target="_blank" class="tarjeta-link">
                            <img src="${curso.imagen || 'https://via.placeholder.com/600x350?text=Sin+Portada'}" alt="${curso.titulo}">
                            <div class="info-curso">
                                <h3>${curso.titulo}</h3>
                                <p>${curso.descripcion}</p>
                            </div>
                        </a>
                        <div class="card-actions">
                            <button class="btn btn-secondary btn-editar">Editar</button>
                            <button class="btn btn-danger btn-eliminar">Eliminar</button>
                        </div>
                    `;

                    card.querySelector('.btn-editar').addEventListener('click', () => abrirModalEditar(id, curso));
                    card.querySelector('.btn-eliminar').addEventListener('click', async () => {
                        if (confirm(`¿Seguro que deseas eliminar "${curso.titulo}"?`)) {
                            try {
                                await deleteDoc(doc(db, "cursos", id));
                            } catch (err) {
                                alert("Error al eliminar: " + err.message);
                            }
                        }
                    });

                    catalogoContainer.appendChild(card);
                });
            }, (error) => {
                console.error("Error en la consulta Firestore:", error);
                catalogoContainer.innerHTML = `<div class="status-msg" style="color: red;">Error de permisos en Firestore.</div>`;
            });
        }

        btnNuevoCurso.addEventListener('click', () => {
            document.getElementById('modalTitle').textContent = "Agregar Nuevo Curso";
            formCurso.reset();
            document.getElementById('cursoId').value = "";
            document.getElementById('imagenActualUrl').value = "";
            modalCurso.classList.add('active');
        });

        function abrirModalEditar(id, curso) {
            document.getElementById('modalTitle').textContent = "Editar Curso";
            formCurso.reset();
            document.getElementById('cursoId').value = id;
            document.getElementById('titulo').value = curso.titulo;
            document.getElementById('descripcion').value = curso.descripcion;
            document.getElementById('enlace').value = curso.enlace;
            document.getElementById('fotoUrlManual').value = curso.imagen || "";
            modalCurso.classList.add('active');
        }

        btnCancelar.addEventListener('click', () => modalCurso.classList.remove('active'));

        formCurso.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnGuardar.disabled = true;
            btnGuardar.textContent = "Guardando...";

            try {
                const id = document.getElementById('cursoId').value;
                const titulo = document.getElementById('titulo').value.trim();
                const descripcion = document.getElementById('descripcion').value.trim();
                const enlace = document.getElementById('enlace').value.trim();
                const imagenFinal = document.getElementById('fotoUrlManual').value.trim();

                const datosCurso = { titulo, descripcion, enlace, imagen: imagenFinal };

                if (id) {
                    await updateDoc(doc(db, "cursos", id), datosCurso);
                } else {
                    datosCurso.creado = serverTimestamp();
                    await addDoc(collection(db, "cursos"), datosCurso);
                }

                modalCurso.classList.remove('active');
            } catch (error) {
                console.error("Error al guardar en Firebase:", error);
                alert("No se pudo guardar: " + error.message);
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = "Guardar Curso";
            }
        });
    </script>
</body>
</html>
