<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>La Misión de Encoger el Cerebro: Historia de la Computación</title>
  <style>
    /* ==========================================================================
       VARIABLES Y ESTILOS BASE MOBILE-FIRST (Sin dependencias externas)
       ========================================================================== */
    :root {
      --bg-top: #e0f2fe;
      --bg-bottom: #fef9c3;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-shadow: #3730a3;
      --sky: #0284c7;
      --green: #16a34a;
      --green-shadow: #15803d;
      --orange: #ea580c;
      --orange-shadow: #c2410c;
      --yellow: #facc15;
      --slate: #475569;
      --slate-shadow: #334155;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-soft: #e2e8f0;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, #f8fafc 45%, var(--bg-bottom) 100%);
      color: var(--text-main);
      min-height: 100vh;
    }

    body {
      padding-bottom: 92px; /* Espacio para la barra inferior táctil en celular */
    }

    /* ==========================================================================
       ENCABEZADO COMPACTO PARA CELULAR
       ========================================================================== */
    .app-header {
      background: linear-gradient(135deg, #4f46e5 0%, #0284c7 100%);
      color: #ffffff;
      padding: 1rem 1rem 1.25rem;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.22);
    }

    .badge-pill {
      display: inline-block;
      background: rgba(255, 255, 255, 0.22);
      padding: 0.28rem 0.8rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      margin-bottom: 0.35rem;
    }

    .app-header h1 {
      font-size: clamp(1.32rem, 5.2vw, 1.9rem);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 0.3rem;
    }

    .app-header p {
      font-size: clamp(0.88rem, 3.6vw, 1rem);
      opacity: 0.95;
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.35;
    }

    /* ==========================================================================
       CONTENEDOR PRINCIPAL Y TARJETA DE ESTACIÓN
       ========================================================================== */
    .main-wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 0.9rem 0.85rem 1.5rem;
    }

    .station-card {
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      border: 3px solid #dbeafe;
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.09);
      overflow: hidden;
      animation: cardEnter 0.28s ease;
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .station-top {
      padding: 1.05rem 1.1rem;
      background: #f8fafc;
      border-bottom: 2px dashed #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .station-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.14);
    }

    .station-top h2 {
      font-size: clamp(1.18rem, 4.6vw, 1.45rem);
      font-weight: 900;
      line-height: 1.2;
      color: var(--text-main);
    }

    .station-tagline {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--primary);
      margin-top: 0.12rem;
    }

    .station-content {
      padding: 1.05rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Cajitas de explicación ultra claras */
    .explain-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    .explain-box {
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      border: 2px solid transparent;
    }

    .explain-box.what {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .explain-box.why {
      background: #fff7ed;
      border-color: #fed7aa;
    }

    .explain-box h3 {
      font-size: 0.98rem;
      font-weight: 900;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .explain-box p {
      font-size: 0.94rem;
      line-height: 1.45;
      color: #1e293b;
    }

    /* Caja de juego interactivo */
    .game-zone {
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-radius: var(--radius-lg);
      padding: 1rem;
    }

    .game-zone.yellow-theme {
      background: #fefce8;
      border-color: #fde047;
    }

    .game-zone-title {
      font-size: 1.08rem;
      font-weight: 900;
      margin-bottom: 0.25rem;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .game-zone-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
      line-height: 1.35;
    }

    /* Botones táctiles grandes */
    .btn-touch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 48px;
      padding: 0.7rem 1.15rem;
      border: none;
      border-radius: 15px;
      font-size: 0.98rem;
      font-weight: 800;
      color: #ffffff;
      background: var(--primary);
      box-shadow: 0 4px 0 var(--primary-shadow);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
      user-select: none;
    }

    .btn-touch:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--primary-shadow);
    }

    .btn-touch.green {
      background: var(--green);
      box-shadow: 0 4px 0 var(--green-shadow);
    }
    .btn-touch.green:active { box-shadow: 0 1px 0 var(--green-shadow); }

    .btn-touch.orange {
      background: var(--orange);
      box-shadow: 0 4px 0 var(--orange-shadow);
    }
    .btn-touch.orange:active { box-shadow: 0 1px 0 var(--orange-shadow); }

    .btn-touch.slate {
      background: var(--slate);
      box-shadow: 0 4px 0 var(--slate-shadow);
    }
    .btn-touch.slate:active { box-shadow: 0 1px 0 var(--slate-shadow); }

    .btn-touch.full {
      width: 100%;
    }

    .btn-touch:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* ==========================================================================
       ESTACIÓN 1: COLOREAR + SIMULADOR DE TUBO DE VACÍO QUE SE QUEMA
       ========================================================================== */
    .palette-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      background: #ffffff;
      padding: 0.55rem 0.7rem;
      border-radius: 16px;
      border: 2px solid #fef08a;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .swatches-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .swatch-dot {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .swatch-dot.selected {
      transform: scale(1.16);
      outline: 3px solid #0f172a;
    }

    .svg-box {
      background: #ffffff;
      border: 2px dashed #eab308;
      border-radius: 16px;
      padding: 0.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .svg-box svg {
      width: 100%;
      max-width: 300px;
      height: auto;
    }

    .paint-zone {
      cursor: pointer;
      transition: fill 0.18s ease;
    }

    .feedback-pill {
      margin-top: 0.65rem;
      background: #ffffff;
      border-left: 5px solid #eab308;
      padding: 0.65rem 0.85rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e293b;
    }

    /* Simulador del Tubo de Vacío */
    .dark-stage {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 16px;
      padding: 1rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .bulb-visual {
      width: 78px;
      height: 106px;
      margin: 0 auto 0.65rem;
      border-radius: 38px 38px 14px 14px;
      background: #334155;
      border: 3px solid #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.1rem;
      transition: all 0.2s ease;
      position: relative;
    }

    .bulb-visual.lit {
      background: radial-gradient(circle, #fef08a 15%, #f97316 65%, #dc2626 100%);
      border-color: #fde047;
      box-shadow: 0 0 30px #f97316, 0 0 55px rgba(239, 68, 68, 0.75);
      transform: scale(1.04);
    }

    .bulb-visual.burned {
      background: #1e293b;
      border-color: #ef4444;
      box-shadow: none;
    }

    .bit-counter-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.12);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 0.55rem;
      color: #fde047;
    }

    .thermo-wrap {
      width: 100%;
      max-width: 280px;
      margin: 0 auto 0.65rem;
    }

    .thermo-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
      color: #cbd5e1;
    }

    .thermo-bar {
      width: 100%;
      height: 16px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
      border: 2px solid #475569;
    }

    .thermo-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e 0%, #facc15 55%, #ef4444 100%);
      transition: width 0.15s linear;
    }

    .stage-msg {
      font-size: 0.92rem;
      font-weight: 700;
      min-height: 2.6em;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.35;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-top: 0.75rem;
    }

    /* ==========================================================================
       ESTACIÓN 2: JUEGO DE LA LLAVE DE AGUA / MANIJA (TRANSISTOR)
       ========================================================================== */
    .valve-arena {
      background: #0f172a;
      border-radius: 18px;
      padding: 1.1rem 0.75rem;
      color: #ffffff;
      text-align: center;
    }

    .pipe-diagram {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.25rem;
      margin: 0.75rem 0;
      padding: 0 0.25rem;
    }

    .terminal-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      width: 74px;
      flex-shrink: 0;
    }

    .terminal-circle {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: #1e293b;
      border: 3px solid #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      transition: all 0.25s ease;
    }

    .terminal-circle.source-on {
      border-color: #38bdf8;
      background: #0c4a6e;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
    }

    .terminal-circle.led-on {
      border-color: #facc15;
      background: #fef08a;
      box-shadow: 0 0 24px #facc15, 0 0 40px rgba(250, 204, 21, 0.7);
      transform: scale(1.08);
    }

    .terminal-name {
      font-size: 0.74rem;
      font-weight: 800;
      color: #cbd5e1;
      line-height: 1.15;
    }

    .pipe-tube {
      flex: 1;
      height: 18px;
      background: #1e293b;
      border: 2px solid #475569;
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }

    .pipe-water {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        #0284c7 0px,
        #38bdf8 12px,
        #bae6fd 18px,
        #0284c7 28px
      );
      background-size: 28px 100%;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .pipe-water.flowing {
      opacity: 1;
      animation: flowRight 0.55s linear infinite;
    }

    @keyframes flowRight {
      from { background-position: 0 0; }
      to { background-position: 28px 0; }
    }

    /* Manija giratoria táctil */
    .valve-handle-btn {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #334155, #1e293b);
      border: 4px solid #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .valve-handle-btn.open {
      border-color: #facc15;
      box-shadow: 0 0 22px rgba(250, 204, 21, 0.55);
    }

    .handle-bar {
      width: 64px;
      height: 16px;
      background: linear-gradient(90deg, #ef4444, #f87171);
      border-radius: 999px;
      border: 2px solid #ffffff;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.25s ease;
      transform: rotate(90deg); /* Cerrada = atraviesa el tubo */
      position: relative;
    }

    .valve-handle-btn.open .handle-bar {
      transform: rotate(0deg); /* Abierta = alineada con el tubo */
      background: linear-gradient(90deg, #22c55e, #4ade80);
    }

    .handle-center-nut {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #facc15;
      border: 2px solid #0f172a;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Mini-reto código 1 - 0 - 1 */
    .secret-code-box {
      margin-top: 0.85rem;
      background: rgba(255, 255, 255, 0.08);
      border: 2px dashed #38bdf8;
      border-radius: 14px;
      padding: 0.7rem;
    }

    .code-steps {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      margin: 0.45rem 0;
    }

    .code-step-pill {
      padding: 0.35rem 0.8rem;
      border-radius: 10px;
      font-weight: 900;
      font-size: 0.92rem;
      background: #1e293b;
      border: 2px solid #475569;
      color: #94a3b8;
    }

    .code-step-pill.done {
      background: #16a34a;
      border-color: #86efac;
      color: #ffffff;
    }

    .code-step-pill.current {
      border-color: #facc15;
      color: #facc15;
      transform: scale(1.06);
    }

    /* ==========================================================================
       ESTACIÓN 3: ARMAR LA CIUDAD EN LA PASTILLA (CIRCUITO INTEGRADO)
       ========================================================================== */
    .chip-city-board {
      background: #0f172a;
      border-radius: 20px;
      padding: 1rem 0.85rem;
      border: 4px solid #475569;
      position: relative;
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.6);
    }

    /* Patitas metálicas laterales del chip */
    .chip-legs-top, .chip-legs-bottom {
      display: flex;
      justify-content: space-around;
      padding: 0 1.2rem;
    }

    .chip-leg {
      width: 14px;
      height: 10px;
      background: #94a3b8;
      transition: background 0.3s ease;
    }

    .chip-city-board.powered .chip-leg {
      background: #facc15;
      box-shadow: 0 0 8px #facc15;
    }

    .city-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      position: relative;
      padding: 0.35rem;
    }

    /* Pistas de cobre centrales que se iluminan */
    .city-bus-cross-h, .city-bus-cross-v {
      position: absolute;
      background: #334155;
      transition: all 0.4s ease;
      z-index: 1;
    }

    .city-bus-cross-h {
      top: 50%;
      left: 12%;
      right: 12%;
      height: 6px;
      transform: translateY(-50%);
    }

    .city-bus-cross-v {
      left: 50%;
      top: 12%;
      bottom: 12%;
      width: 6px;
      transform: translateX(-50%);
    }

    .city-bus-cross-h.lit, .city-bus-cross-v.lit {
      background: #facc15;
      box-shadow: 0 0 14px #facc15;
    }

    .city-lot {
      position: relative;
      z-index: 2;
      min-height: 92px;
      border-radius: 14px;
      background: #1e293b;
      border: 2.5px dashed #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      text-align: center;
      transition: all 0.25s ease;
    }

    .city-lot.built {
      border-style: solid;
      border-color: #22c55e;
      background: linear-gradient(135deg, #064e3b 0%, #0f172a 100%);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.35);
      animation: popBuild 0.3s ease;
    }

    @keyframes popBuild {
      0% { transform: scale(0.88); }
      70% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .city-lot-emoji {
      font-size: 1.75rem;
      margin-bottom: 0.2rem;
    }

    .city-lot-name {
      font-size: 0.8rem;
      font-weight: 800;
      color: #f8fafc;
      line-height: 1.15;
    }

    .city-lot-empty-text {
      font-size: 0.76rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .buildings-dock {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      margin-top: 0.85rem;
    }

    .build-btn {
      background: #ffffff;
      border: 2.5px solid #93c5fd;
      border-radius: 14px;
      padding: 0.6rem 0.55rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 3px 0 #bfdbfe;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .build-btn:active:not(:disabled) {
      transform: translateY(2px);
    }

    .build-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      background: #f1f5f9;
    }

    /* ==========================================================================
       ESTACIÓN 4: RAYO ENCOGEDOR DEL MICROPROCESADOR
       ========================================================================== */
    .shrink-lab {
      background: #0f172a;
      border-radius: 18px;
      padding: 1rem 0.75rem;
      color: #ffffff;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .scale-meter-badge {
      display: inline-block;
      background: #312e81;
      border: 2px solid #818cf8;
      color: #e0e7ff;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 800;
      margin-bottom: 0.8rem;
    }

    /* La pastilla del tamaño de una uña en el centro */
    .micro-chip-target {
      width: 210px;
      height: 190px;
      margin: 0 auto 0.85rem;
      border-radius: 22px;
      background: #1e293b;
      border: 4px solid #f59e0b;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.65rem;
      box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.18);
      transition: all 0.35s ease;
    }

    .micro-chip-target.complete {
      border-color: #22c55e;
      background: linear-gradient(135deg, #1e1b4b, #064e3b);
      box-shadow: 0 0 28px rgba(34, 197, 94, 0.65);
    }

    .chip-target-label {
      position: absolute;
      top: -12px;
      background: #f59e0b;
      color: #0f172a;
      font-size: 0.72rem;
      font-weight: 900;
      padding: 0.15rem 0.65rem;
      border-radius: 999px;
    }

    .micro-chip-target.complete .chip-target-label {
      background: #22c55e;
      color: #ffffff;
    }

    /* Las 3 piezas del cerebro que empiezan gigantes y se van encogiendo */
    .brain-part-bar {
      width: 100%;
      border-radius: 12px;
      padding: 0.45rem 0.5rem;
      font-weight: 800;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.25s ease;
      border: 2px solid #ffffff;
      white-space: nowrap;
    }

    .brain-part-bar.oversized {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.5);
    }

    .brain-part-bar.fitted {
      background: #22c55e;
      color: #ffffff;
      transform: scale(1) !important;
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.4);
    }

    /* ==========================================================================
       RETO FINAL: DE UN CUARTO GIGANTE A TU BOLSILLO
       ========================================================================== */
    .shrink-timeline-stage {
      background: #0f172a;
      border-radius: 18px;
      padding: 0.95rem 0.6rem;
      color: #ffffff;
      text-align: center;
    }

    .size-compare-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: end;
      gap: 0.4rem;
      min-height: 128px;
      padding-top: 0.6rem;
    }

    .size-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }

    .size-box {
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.16);
      border: 2px dashed #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.35s ease;
    }

    .size-box.unlocked {
      background: linear-gradient(135deg, #22c55e, #0284c7);
      border: 2px solid #ffffff;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.55);
    }

    .size-caption {
      font-size: 0.72rem;
      font-weight: 800;
      color: #cbd5e1;
      line-height: 1.15;
    }

    .order-list-btns {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-bottom: 0.85rem;
    }

    .choice-card-btn {
      width: 100%;
      background: #ffffff;
      border: 2.5px solid #93c5fd;
      border-radius: 14px;
      padding: 0.65rem 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 3px 0 #bfdbfe;
    }

    .choice-card-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .slot-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      background: #ffffff;
      border: 2.5px dashed #94a3b8;
      border-radius: 14px;
      padding: 0.6rem 0.8rem;
      margin-bottom: 0.5rem;
      min-height: 54px;
      cursor: pointer;
    }

    .slot-item.filled {
      border-style: solid;
      border-color: #4f46e5;
      background: #eef2ff;
    }

    .slot-item.correct {
      border-color: #16a34a;
      background: #dcfce7;
    }

    .slot-num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e2e8f0;
      font-weight: 900;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .victory-card {
      margin-top: 1rem;
      background: linear-gradient(135deg, #fef08a 0%, #bbf7d0 100%);
      border: 3px solid #22c55e;
      border-radius: 20px;
      padding: 1.15rem;
      text-align: center;
      animation: popBuild 0.4s ease;
    }

    /* ==========================================================================
       BARRA DE NAVEGACIÓN INFERIOR FIJA (PULGARES EN CELULAR)
       ========================================================================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-top: 2px solid #cbd5e1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 0.4rem 0.35rem calc(0.45rem + env(safe-area-inset-bottom));
      gap: 0.25rem;
      z-index: 50;
      box-shadow: 0 -6px 18px rgba(15, 23, 42, 0.08);
    }

    .tab-btn {
      background: transparent;
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 0.35rem 0.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      cursor: pointer;
      color: #475569;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: #fef9c3;
      border-color: #eab308;
      color: #0f172a;
      transform: translateY(-2px);
    }

    .tab-btn.done:not(.active) .tab-icon::after {
      content: '✓';
      font-size: 0.65rem;
      background: #16a34a;
      color: #ffffff;
      border-radius: 50%;
      padding: 1px 4px;
      margin-left: 2px;
      vertical-align: top;
    }

    .tab-icon {
      font-size: 1.35rem;
      line-height: 1;
    }

    .tab-text {
      font-size: 0.68rem;
      font-weight: 800;
      line-height: 1.1;
      text-align: center;
    }

    /* Confeti de celebración */
    .confetti {
      position: fixed;
      width: 10px;
      height: 14px;
      top: -20px;
      z-index: 999;
      pointer-events: none;
      animation: fallDown 2.6s linear forwards;
    }

    @keyframes fallDown {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="app-header">
    <span class="badge-pill">🚀 Aventura Interactiva</span>
    <h1>La Misión de Encoger el Cerebro</h1>
    <p>Descubre cómo la computadora pasó de ocupar un cuarto gigante a caber en la punta de tu dedo.</p>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-wrap">
    <section id="station-view" class="station-card" aria-live="polite"></section>
  </main>

  <!-- BARRA INFERIOR TÁCTIL PARA CELULAR -->
  <nav class="bottom-nav" aria-label="Estaciones del juego">
    <button class="tab-btn active" data-tab="0" onclick="goToStep(0)">
      <span class="tab-icon">💡</span>
      <span class="tab-text">1. Tubo</span>
    </button>
    <button class="tab-btn" data-tab="1" onclick="goToStep(1)">
      <span class="tab-icon">🚰</span>
      <span class="tab-text">2. Llave</span>
    </button>
    <button class="tab-btn" data-tab="2" onclick="goToStep(2)">
      <span class="tab-icon">🏙️</span>
      <span class="tab-text">3. Ciudad</span>
    </button>
    <button class="tab-btn" data-tab="3" onclick="goToStep(3)">
      <span class="tab-icon">🧠</span>
      <span class="tab-text">4. Encoger</span>
    </button>
    <button class="tab-btn" data-tab="4" onclick="goToStep(4)">
      <span class="tab-icon">🏆</span>
      <span class="tab-text">Reto Final</span>
    </button>
  </nav>

  <script>
    /* ==========================================================================
       ESTADO GLOBAL DE LA APLICACIÓN
       ========================================================================== */
    const PALETTE = [
      { name: 'Rojo', hex: '#ef4444' },
      { name: 'Amarillo', hex: '#facc15' },
      { name: 'Azul', hex: '#38bdf8' },
      { name: 'Verde', hex: '#22c55e' },
      { name: 'Naranja', hex: '#fb923c' },
      { name: 'Morado', hex: '#a855f7' }
    ];

    const state = {
      step: 0,
      visited: new Set([0]),

      // Estación 1: Tubo de vacío (Colorear + Encender y quemarse)
      selectedColor: '#facc15',
      tubePaint: {},
      tubePaintMsg: '👆 Elige un color arriba y toca el cristal, el filamento o la base para pintarlo.',
      tubeOn: false,
      tubeHeat: 0,
      tubeBurned: false,
      tubeBits: [],
      heatTimer: null,

      // Estación 2: Transistor (Llave de agua / Manija)
      valveOpen: false,
      codeProgress: 0, // Secuencia objetivo: [1 (abrir), 0 (cerrar), 1 (abrir)]
      codeCompleted: false,

      // Estación 3: Circuito Integrado (Armar la ciudad en la pastilla)
      cityBlocks: {
        energia: false,
        avenida: false,
        memoria: false,
        puerta: false
      },

      // Estación 4: Microprocesador (Encoger el cerebro para que quepa en la pastilla)
      shrinkLevel: 0, // 0 = Cuarto (1.42x), 1 = Caja (1.24x), 2 = Galleta (1.10x), 3 = Uña (Cabe!)
      brainFitted: false,

      // Reto Final: Ordenar de mayor a menor tamaño
      slots: [null, null, null, null],
      challengeSolved: false,
      challengeFeedback: ''
    };

    /* ==========================================================================
       NAVEGACIÓN ENTRE ESTACIONES
       ========================================================================== */
    function goToStep(idx) {
      // Si salimos de la estación 1, pausamos el temporizador de calor
      if (state.step === 0 && idx !== 0) {
        stopHeatLoop();
      }
      state.step = idx;
      state.visited.add(idx);
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateNavTabs() {
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === state.step);
        btn.classList.toggle('done', state.visited.has(idx) && idx !== state.step);
      });
    }

    /* ==========================================================================
       ESTACIÓN 1: EL TUBO DE VACÍO (COLOREAR + ENCENDER Y QUEMARSE)
       ========================================================================== */
    const TUBE_PART_INFO = {
      glass: '🔵 Cristal al vacío: Guarda el espacio sin aire para que el foco pueda brillar.',
      filament: '🟡 Filamento: Se pone al rojo vivo para mandar chispas (1 = encendido, 0 = apagado).',
      plate: '🟠 Placa metálica: Recibe las chispas cuando el foco está prendido.',
      base: '🟣 Base y patitas: Conectan este foco gigante a cables gruesos.'
    };

    function selectTubeColor(hex) {
      state.selectedColor = hex;
      render();
    }

    function paintTubeZone(zone) {
      state.tubePaint[zone] = state.selectedColor;
      state.tubePaintMsg = TUBE_PART_INFO[zone];
      render();
    }

    function clearTubePaint() {
      state.tubePaint = {};
      state.tubePaintMsg = '🧹 ¡Dibujo limpio! Elige un color y píntalo a tu gusto.';
      render();
    }

    function toggleVacuumSwitch() {
      if (state.tubeBurned) return;
      state.tubeOn = !state.tubeOn;
      state.tubeBits.push(state.tubeOn ? '1' : '0');
      if (state.tubeBits.length > 6) state.tubeBits.shift();

      if (state.tubeOn) {
        startHeatLoop();
      } else {
        stopHeatLoop();
      }
      render();
    }

    function startHeatLoop() {
      stopHeatLoop();
      state.heatTimer = setInterval(() => {
        if (!state.tubeOn || state.tubeBurned) {
          stopHeatLoop();
          return;
        }
        state.tubeHeat = Math.min(100, state.tubeHeat + 14);
        if (state.tubeHeat >= 100) {
          state.tubeBurned = true;
          state.tubeOn = false;
          stopHeatLoop();
        }
        render();
      }, 450);
    }

    function stopHeatLoop() {
      if (state.heatTimer) {
        clearInterval(state.heatTimer);
        state.heatTimer = null;
      }
    }

    function replaceBurnedTube() {
      stopHeatLoop();
      state.tubeOn = false;
      state.tubeHeat = 0;
      state.tubeBurned = false;
      state.tubeBits = [];
      render();
    }

    function renderStation1(el) {
      const p = state.tubePaint;
      const fill = (k, def) => p[k] || def;

      const swatchesHTML = PALETTE.map(
        (c) => `
          <button
            class="swatch-dot ${state.selectedColor === c.hex ? 'selected' : ''}"
            style="background:${c.hex};"
            aria-label="Color ${c.name}"
            onclick="selectTubeColor('${c.hex}')">
          </button>
        `
      ).join('');

      let bulbClass = 'bulb-visual';
      let bulbIcon = '💤';
      let statusText = 'Apagado (0). Toca el botón naranja para prender el foco.';

      if (state.tubeBurned) {
        bulbClass += ' burned';
        bulbIcon = '💥';
        statusText = '¡PUM! Se calentó demasiado y se quemó. ¡Por eso necesitaban inventar algo mejor!';
      } else if (state.tubeOn) {
        bulbClass += ' lit';
        bulbIcon = '💡';
        statusText =
          state.tubeHeat >= 65
            ? '🔥 ¡Cuidado, está hirviendo! ¡Apágalo antes de que explote!'
            : '✨ ¡Encendido (1)! Mira cómo sube rápido la temperatura...';
      }

      const bitsDisplay = state.tubeBits.length ? state.tubeBits.join(' - ') : 'Esperando señal...';

      el.innerHTML = `
        <div class="station-top">
          <div class="station-icon-box" style="background:#fef08a;">💡</div>
          <div>
            <h2>Estación 1: El Tubo de Vacío</h2>
            <div class="station-tagline">«El foco gigante que pensaba (1 y 0)»</div>
          </div>
        </div>

        <div class="station-content">
          <div class="explain-grid">
            <div class="explain-box what">
              <h3>🤔 ¿Qué era?</h3>
              <p>Era como un <strong>foco antiguo gigante</strong>. Cuando se prendía decía <strong>"SÍ" (1)</strong> y cuando se apagaba decía <strong>"NO" (0)</strong>. ¡Las primeras computadoras tenían miles de estos focos!</p>
            </div>
            <div class="explain-box why">
              <h3>🔥 ¿Por qué lo cambiaron?</h3>
              <p>Ocupaban un cuarto entero, se calentaban como un horno y se fundían a cada rato.</p>
            </div>
          </div>

          <!-- JUEGO 1A: COLOREAR EL TUBO DE VACÍO -->
          <div class="game-zone yellow-theme">
            <div class="game-zone-title">
              <span>🎨 1. Colorea el Tubo de Vacío</span>
              <button class="btn-touch slate" style="min-height:38px; padding:0.35rem 0.75rem; font-size:0.82rem;" onclick="clearTubePaint()">
                🧹 Limpiar
              </button>
            </div>
            <p class="game-zone-sub">Toca un color y luego toca cada parte del dibujo:</p>

            <div class="palette-row">
              <div class="swatches-group">${swatchesHTML}</div>
            </div>

            <div class="svg-box">
              <svg viewBox="0 0 300 245" role="img" aria-label="Tubo de vacío para colorear">
                <!-- Base y patitas -->
                <g class="paint-zone" onclick="paintTubeZone('base')">
                  <rect x="108" y="196" width="14" height="30" rx="4" fill="${fill('base', '#e2e8f0')}" stroke="#0f172a" stroke-width="3"/>
                  <rect x="143" y="196" width="14" height="34" rx="4" fill="${fill('base', '#e2e8f0')}" stroke="#0f172a" stroke-width="3"/>
                  <rect x="178" y="196" width="14" height="30" rx="4" fill="${fill('base', '#e2e8f0')}" stroke="#0f172a" stroke-width="3"/>
                  <rect x="86" y="170" width="128" height="30" rx="10" fill="${fill('base', '#e2e8f0')}" stroke="#0f172a" stroke-width="3.5"/>
                </g>
                <!-- Cristal -->
                <path class="paint-zone" onclick="paintTubeZone('glass')"
                  d="M92,170 L92,76 C92,28 208,28 208,76 L208,170 Z"
                  fill="${fill('glass', '#f8fafc')}" stroke="#0f172a" stroke-width="4"/>
                <!-- Placas metálicas -->
                <g class="paint-zone" onclick="paintTubeZone('plate')">
                  <rect x="108" y="72" width="18" height="76" rx="6" fill="${fill('plate', '#e2e8f0')}" stroke="#0f172a" stroke-width="3"/>
                  <rect x="174" y="72" width="18" height="76" rx="6" fill="${fill('plate', '#e2e8f0')}" stroke="#0f172a" stroke-width="3"/>
                </g>
                <!-- Filamento central -->
                <path class="paint-zone" onclick="paintTubeZone('filament')"
                  d="M138,170 L138,108 L150,85 L162,108 L162,170 Z"
                  fill="${fill('filament', '#ffffff')}" stroke="#0f172a" stroke-width="3.5"/>
              </svg>
            </div>
            <div class="feedback-pill">${state.tubePaintMsg}</div>
          </div>

          <!-- JUEGO 1B: PRÉNDELO SIN QUE EXPLOTE -->
          <div class="game-zone">
            <div class="game-zone-title">⚡ 2. Préndelo sin que se queme</div>
            <p class="game-zone-sub">Enciende el foco para mandar "1", pero apágalo antes de que llegue al 100% de calor.</p>

            <div class="dark-stage">
              <div class="bit-counter-badge">Señales: ${bitsDisplay}</div>
              <div class="${bulbClass}">${bulbIcon}</div>

              <div class="thermo-wrap">
                <div class="thermo-label">
                  <span>🌡️ Calor del foco</span>
                  <span>${state.tubeHeat}%</span>
                </div>
                <div class="thermo-bar">
                  <div class="thermo-fill" style="width:${state.tubeHeat}%;"></div>
                </div>
              </div>

              <div class="stage-msg">${statusText}</div>
            </div>

            <div class="btn-row">
              <button class="btn-touch orange" onclick="toggleVacuumSwitch()" ${state.tubeBurned ? 'disabled' : ''}>
                ${state.tubeOn ? '🛑 Apagar (0)' : '💡 Prender (1)'}
              </button>
              <button class="btn-touch slate" onclick="replaceBurnedTube()">
                ❄️ Enfriar / Cambiar
              </button>
            </div>
          </div>

          <button class="btn-touch green full" onclick="goToStep(1)">
            Siguiente: El Transistor (La Llave) ➡️
          </button>
        </div>
      `;
    }

    /* ==========================================================================
       ESTACIÓN 2: EL TRANSISTOR (JUEGO DE LA LLAVE DE AGUA / MANIJA)
       ========================================================================== */
    const TARGET_SEQUENCE = [true, false, true]; // 1 (abierta) -> 0 (cerrada) -> 1 (abierta)

    function toggleWaterValve() {
      state.valveOpen = !state.valveOpen;

      if (!state.codeCompleted) {
        const expected = TARGET_SEQUENCE[state.codeProgress];
        if (state.valveOpen === expected) {
          state.codeProgress += 1;
          if (state.codeProgress === TARGET_SEQUENCE.length) {
            state.codeCompleted = true;
          }
        } else {
          // Si reinicia el patrón empezando por abrir (true), avanza a 1
          state.codeProgress = state.valveOpen === true ? 1 : 0;
        }
      }
      render();
    }

    function resetValveChallenge() {
      state.valveOpen = false;
      state.codeProgress = 0;
      state.codeCompleted = false;
      render();
    }

    function renderStation2(el) {
      const open = state.valveOpen;

      const stepLabels = ['1 (Abrir)', '0 (Cerrar)', '1 (Abrir)'];
      const codePillsHTML = stepLabels
        .map((lbl, idx) => {
          let cls = 'code-step-pill';
          if (state.codeCompleted || idx < state.codeProgress) cls += ' done';
          else if (idx === state.codeProgress) cls += ' current';
          return `<span class="${cls}">${lbl}</span>`;
        })
        .join('');

      el.innerHTML = `
        <div class="station-top">
          <div class="station-icon-box" style="background:#bae6fd;">🚰</div>
          <div>
            <h2>Estación 2: El Transistor</h2>
            <div class="station-tagline">«La llave de agua para la electricidad»</div>
          </div>
        </div>

        <div class="station-content">
          <div class="explain-grid">
            <div class="explain-box what">
              <h3>🤔 ¿Qué era?</h3>
              <p>Piensa en una <strong>llave de agua</strong>: cuando giras la manija, el agua pasa. El transistor hace lo mismo con la electricidad, pero es <strong>chiquito como una lenteja</strong> y no se calienta.</p>
            </div>
            <div class="explain-box why">
              <h3>🔄 ¿Por qué lo cambiaron después?</h3>
              <p>Funcionaba de maravilla, pero había que soldar miles uno por uno a mano con cablecitos.</p>
            </div>
          </div>

          <!-- JUEGO DE LA LLAVE DE AGUA -->
          <div class="game-zone">
            <div class="game-zone-title">🚰 Gira la Manija del Transistor</div>
            <p class="game-zone-sub">Toca la manija roja/verde del centro para abrir o cerrar el paso de energía.</p>

            <div class="valve-arena">
              <div style="font-size:0.82rem; font-weight:800; color:#38bdf8; margin-bottom:0.35rem;">
                🌡️ Calor: 0% (¡Nunca se quema!)
              </div>

              <div class="pipe-diagram">
                <!-- Entrada (Emisor) -->
                <div class="terminal-node">
                  <div class="terminal-circle source-on">⚡</div>
                  <span class="terminal-name">Entrada<br/>(Emisor)</span>
                </div>

                <!-- Tubo izquierdo -->
                <div class="pipe-tube">
                  <div class="pipe-water flowing"></div>
                </div>

                <!-- Manija central (Base) -->
                <button
                  class="valve-handle-btn ${open ? 'open' : ''}"
                  onclick="toggleWaterValve()"
                  aria-label="Girar manija del transistor">
                  <div class="handle-bar">
                    <div class="handle-center-nut"></div>
                  </div>
                </button>

                <!-- Tubo derecho -->
                <div class="pipe-tube">
                  <div class="pipe-water ${open ? 'flowing' : ''}"></div>
                </div>

                <!-- Salida (Colector) -->
                <div class="terminal-node">
                  <div class="terminal-circle ${open ? 'led-on' : ''}">${open ? '🌟' : '⚫'}</div>
                  <span class="terminal-name">Salida<br/>(Colector)</span>
                </div>
              </div>

              <div class="stage-msg" style="min-height:2.2em;">
                ${
                  open
                    ? '💧⚡ ¡Manija ABIERTA (1)! La corriente cruza rápido y enciende la luz.'
                    : '🔒 Manija CERRADA (0). La compuerta detiene el paso al instante.'
                }
              </div>

              <!-- Mini-reto código 1 - 0 - 1 -->
              <div class="secret-code-box">
                <div style="font-size:0.84rem; font-weight:800; color:#fde047;">
                  ${
                    state.codeCompleted
                      ? '🎉 ¡Código secreto 1 - 0 - 1 enviado sin calor!'
                      : '🎯 Mini-reto: Gira la manija para enviar 1 - 0 - 1:'
                  }
                </div>
                <div class="code-steps">${codePillsHTML}</div>
                ${
                  state.codeCompleted
                    ? `<button class="btn-touch slate" style="min-height:36px; padding:0.3rem 0.75rem; font-size:0.8rem; margin-top:0.3rem;" onclick="resetValveChallenge()">🔄 Repetir reto</button>`
                    : ''
                }
              </div>
            </div>

            <button class="btn-touch orange full" style="margin-top:0.8rem;" onclick="toggleWaterValve()">
              ${open ? '🔒 Cerrar manija (0)' : '🔓 Girar y abrir manija (1)'}
            </button>
          </div>

          <button class="btn-touch green full" onclick="goToStep(2)">
            Siguiente: El Circuito Integrado (Chip) ➡️
          </button>
        </div>
      `;
    }

    /* ==========================================================================
       ESTACIÓN 3: CIRCUITO INTEGRADO (JUEGO DE ARMAR LA CIUDAD EN LA PASTILLA)
       ========================================================================== */
    const CITY_DISTRICTS = [
      { key: 'energia', icon: '⚡', name: 'Central de Energía', desc: 'Da fuerza a toda la pastilla' },
      { key: 'avenida', icon: '🛣️', name: 'Avenida de Datos', desc: 'Conecta los caminos sin cables' },
      { key: 'memoria', icon: '🏛️', name: 'Barrio de Memoria', desc: 'Guarda los recuerdos' },
      { key: 'puerta', icon: '🚦', name: 'Puerta Lógica', desc: 'Toma decisiones rápidas' }
    ];

    function buildDistrict(key) {
      state.cityBlocks[key] = true;
      render();
    }

    function resetCityChip() {
      state.cityBlocks = { energia: false, avenida: false, memoria: false, puerta: false };
      render();
    }

    function renderStation3(el) {
      const builtCount = Object.values(state.cityBlocks).filter(Boolean).length;
      const allBuilt = builtCount === 4;

      const lotsHTML = CITY_DISTRICTS.map((d) => {
        const isBuilt = state.cityBlocks[d.key];
        return `
          <div class="city-lot ${isBuilt ? 'built' : ''}">
            ${
              isBuilt
                ? `<div class="city-lot-emoji">${d.icon}</div>
                   <div class="city-lot-name">${d.name}</div>`
                : `<div class="city-lot-emoji" style="opacity:0.35;">🏗️</div>
                   <div class="city-lot-empty-text">Espacio vacío</div>`
            }
          </div>
        `;
      }).join('');

      const dockBtnsHTML = CITY_DISTRICTS.map((d) => {
        const isBuilt = state.cityBlocks[d.key];
        return `
          <button class="build-btn" onclick="buildDistrict('${d.key}')" ${isBuilt ? 'disabled' : ''}>
            <span style="font-size:1.55rem;">${d.icon}</span>
            <div>
              <div style="font-size:0.84rem; font-weight:900; color:#0f172a;">${d.name}</div>
              <div style="font-size:0.72rem; color:#475569;">${isBuilt ? '✅ Instalado' : 'Toca para poner'}</div>
            </div>
          </button>
        `;
      }).join('');

      el.innerHTML = `
        <div class="station-top">
          <div class="station-icon-box" style="background:#bbf7d0;">🏙️</div>
          <div>
            <h2>Estación 3: El Circuito Integrado</h2>
            <div class="station-tagline">«Una mini-ciudad dibujada en una pastilla»</div>
          </div>
        </div>

        <div class="station-content">
          <div class="explain-grid">
            <div class="explain-box what">
              <h3>🤔 ¿Qué era?</h3>
              <p>En vez de pegar miles de transistores con cables sueltos, los científicos los <strong>dibujaron todos juntos como una ciudad</strong> dentro de una sola pastillita negra (un chip).</p>
            </div>
            <div class="explain-box why">
              <h3>🔄 ¿Por qué lo mejoraron después?</h3>
              <p>Al principio cada pastilla hacía una sola tarea y hacían falta varios chips para formar un cerebro completo.</p>
            </div>
          </div>

          <!-- JUEGO: ARMAR LA CIUDAD EN LA PASTILLA -->
          <div class="game-zone">
            <div class="game-zone-title">
              <span>🏙️ Construye la Ciudad del Chip</span>
              <span style="font-size:0.82rem; color:#0284c7;">${builtCount}/4 listos</span>
            </div>
            <p class="game-zone-sub">Toca los 4 bloques de abajo para meterlos dentro de la pastilla y encender sus calles.</p>

            <div class="chip-city-board ${allBuilt ? 'powered' : ''}">
              <div class="chip-legs-top">
                <div class="chip-leg"></div><div class="chip-leg"></div><div class="chip-leg"></div><div class="chip-leg"></div>
              </div>

              <div class="city-grid">
                <div class="city-bus-cross-h ${builtCount >= 2 ? 'lit' : ''}"></div>
                <div class="city-bus-cross-v ${builtCount >= 3 ? 'lit' : ''}"></div>
                ${lotsHTML}
              </div>

              <div class="chip-legs-bottom">
                <div class="chip-leg"></div><div class="chip-leg"></div><div class="chip-leg"></div><div class="chip-leg"></div>
              </div>
            </div>

            <div class="buildings-dock">${dockBtnsHTML}</div>

            ${
              allBuilt
                ? `<div class="feedback-pill" style="border-left-color:#16a34a; background:#dcfce7; margin-top:0.8rem;">
                     🎉 ¡Ciudad completa! Ya no hay cables enredados: todo vive unido dentro de una sola pastilla.
                   </div>
                   <button class="btn-touch slate full" style="margin-top:0.6rem;" onclick="resetCityChip()">🔄 Armar ciudad otra vez</button>`
                : ''
            }
          </div>

          <button class="btn-touch green full" onclick="goToStep(3)">
            Siguiente: El Microprocesador ➡️
          </button>
        </div>
      `;
    }

    /* ==========================================================================
       ESTACIÓN 4: EL MICROPROCESADOR (JUEGO DE ENCOGER EL CEREBRO EN LA PASTILLA)
       ========================================================================== */
    const SHRINK_STEPS = [
      { label: '🏠 Tamaño: Cuarto gigante (¡No cabe!)', scale: 1.42 },
      { label: '📦 Tamaño: Caja grande (Todavía se sale)', scale: 1.25 },
      { label: '🍪 Tamaño: Galleta (¡Casi entra!)', scale: 1.1 },
      { label: '👆 Tamaño: Uña de tu dedo (¡Cabe perfecto!)', scale: 0.96 }
    ];

    function shrinkBrainStep() {
      if (state.shrinkLevel < 3) {
        state.shrinkLevel += 1;
        render();
      }
    }

    function fitBrainInsideChip() {
      if (state.shrinkLevel === 3) {
        state.brainFitted = true;
        render();
      }
    }

    function resetShrinkLab() {
      state.shrinkLevel = 0;
      state.brainFitted = false;
      render();
    }

    function renderStation4(el) {
      const currentShrink = SHRINK_STEPS[state.shrinkLevel];
      const readyToFit = state.shrinkLevel === 3;
      const fitted = state.brainFitted;

      const partClass = fitted ? 'brain-part-bar fitted' : 'brain-part-bar oversized';
      const partStyle = fitted ? '' : `transform: scale(${currentShrink.scale});`;

      el.innerHTML = `
        <div class="station-top">
          <div class="station-icon-box" style="background:#e9d5ff;">🧠</div>
          <div>
            <h2>Estación 4: El Microprocesador</h2>
            <div class="station-tagline">«Todo el cerebro completo en la punta de tu dedo»</div>
          </div>
        </div>

        <div class="station-content">
          <div class="explain-grid">
            <div class="explain-box what">
              <h3>🤔 ¿Qué es?</h3>
              <p>Es el <strong>jefe supremo</strong>: lograron encoger TODAS las partes del cerebro (el que calcula, el que manda y la memoria rápida) y meterlas en <strong>una sola uña</strong>.</p>
            </div>
            <div class="explain-box why">
              <h3>🚀 ¿Qué logró este invento?</h3>
              <p>Gracias a que ya cabía en cualquier lugar, nacieron las computadoras de escritorio, las laptops y los celulares.</p>
            </div>
          </div>

          <!-- JUEGO: RAYO ENCOGEDOR -->
          <div class="game-zone">
            <div class="game-zone-title">🔬 Rayo Encogedor del Cerebro</div>
            <p class="game-zone-sub">Las 3 partes del cerebro son gigantes y se salen del chip. ¡Encógelas hasta que quepan adentro!</p>

            <div class="shrink-lab">
              <div class="scale-meter-badge">${currentShrink.label}</div>

              <div class="micro-chip-target ${fitted ? 'complete' : ''}">
                <span class="chip-target-label">
                  ${fitted ? '✅ ¡CEREBRO ENCAJADO!' : 'Pastilla del tamaño de una uña'}
                </span>

                <div class="${partClass}" style="${partStyle}">🎯 Unidad de Control (Jefe)</div>
                <div class="${partClass}" style="${partStyle}">🧮 Calculadora Rápida (ALU)</div>
                <div class="${partClass}" style="${partStyle}">⚡ Memoria Caché</div>
              </div>

              <div class="stage-msg" style="min-height:2.4em;">
                ${
                  fitted
                    ? '📱💻 ¡Increíble! Ahora todo el cerebro cabe en tu bolsillo o en una laptop.'
                    : readyToFit
                      ? '✨ ¡Ya son pequeñitas! Toca el botón verde para meterlas dentro del chip.'
                      : '⚠️ Son demasiado grandes y chocan fuera del borde. ¡Usa el Rayo Encogedor!'
                }
              </div>
            </div>

            ${
              !fitted
                ? `<div class="btn-row">
                     <button class="btn-touch orange" onclick="shrinkBrainStep()" ${readyToFit ? 'disabled' : ''}>
                       ⚡ ¡ENCOGER! (${state.shrinkLevel}/3)
                     </button>
                     <button class="btn-touch green" onclick="fitBrainInsideChip()" ${!readyToFit ? 'disabled' : ''}>
                       📥 Meter al chip
                     </button>
                   </div>`
                : `<button class="btn-touch slate full" style="margin-top:0.75rem;" onclick="resetShrinkLab()">
                     🔄 Volver a encoger
                   </button>`
            }
          </div>

          <button class="btn-touch green full" onclick="goToStep(4)">
            ¡Ir al Reto Final! 🏆
          </button>
        </div>
      `;
    }

    /* ==========================================================================
       RETO FINAL: DE UN CUARTO GIGANTE A TU BOLSILLO
       ========================================================================== */
    const FINAL_PIECES = [
      { id: 'tubo', rank: 0, icon: '💡', name: 'Tubo de Vacío', hint: 'Foco gigante que ocupaba un cuarto' },
      { id: 'transistor', rank: 1, icon: '🚰', name: 'Transistor', hint: 'Llave chiquita como una lenteja' },
      { id: 'chip', rank: 2, icon: '🏙️', name: 'Circuito Integrado', hint: 'Ciudad de transistores en pastilla' },
      { id: 'micro', rank: 3, icon: '🧠', name: 'Microprocesador', hint: 'Todo el cerebro en tu dedo' }
    ];

    const MIXED_IDS = ['chip', 'tubo', 'micro', 'transistor'];

    function pickPieceForTimeline(id) {
      if (state.challengeSolved) return;
      const emptyIdx = state.slots.findIndex((x) => x === null);
      if (emptyIdx === -1) return;
      state.slots[emptyIdx] = FINAL_PIECES.find((p) => p.id === id);
      state.challengeFeedback = '';
      render();
    }

    function removeSlotPiece(idx) {
      if (state.challengeSolved) return;
      state.slots[idx] = null;
      state.challengeFeedback = '';
      render();
    }

    function verifyTimelineOrder() {
      if (state.slots.some((s) => s === null)) {
        state.challengeFeedback = '⚠️ Primero toca las 4 piezas para llenar los espacios del 1 al 4.';
        render();
        return;
      }

      const ok = state.slots.every((p, idx) => p.rank === idx);
      if (ok) {
        state.challengeSolved = true;
        state.challengeFeedback = '';
        spawnConfetti();
      } else {
        state.challengeFeedback =
          '🤔 ¡Casi! Recuerda el orden del tamaño: 1º Foco gigante (Tubo), 2º Llave chiquita (Transistor), 3º Ciudad en pastilla (Chip) y 4º Cerebro en tu dedo (Microprocesador).';
      }
      render();
    }

    function resetTimelineChallenge() {
      state.slots = [null, null, null, null];
      state.challengeSolved = false;
      state.challengeFeedback = '';
      render();
    }

    function renderFinalChallenge(el) {
      const stagesMeta = [
        { label: '1. Cuarto', icon: '🏠💡', w: 66, h: 86 },
        { label: '2. Armario', icon: '🗄️🚰', w: 56, h: 66 },
        { label: '3. Caja', icon: '🖥️🏙️', w: 48, h: 48 },
        { label: '4. ¡Tu dedo!', icon: '👆🧠', w: 38, h: 36 }
      ];

      const theaterHTML = stagesMeta
        .map((st, idx) => {
          const unlocked = state.challengeSolved || (state.slots[idx] && state.slots[idx].rank === idx);
          return `
            <div class="size-col">
              <div class="size-box ${unlocked ? 'unlocked' : ''}" style="width:${st.w}px; height:${st.h}px; font-size:${idx === 3 ? '1rem' : '1.35rem'};">
                ${unlocked ? st.icon : '❓'}
              </div>
              <span class="size-caption" style="color:${unlocked ? '#86efac' : '#cbd5e1'};">${st.label}</span>
            </div>
          `;
        })
        .join('');

      const used = new Set(state.slots.filter(Boolean).map((p) => p.id));

      const choicesHTML = MIXED_IDS.map((id) => {
        const item = FINAL_PIECES.find((p) => p.id === id);
        const disabled = used.has(id) || state.challengeSolved;
        return `
          <button class="choice-card-btn" onclick="pickPieceForTimeline('${id}')" ${disabled ? 'disabled' : ''}>
            <span style="font-size:1.65rem;">${item.icon}</span>
            <div>
              <div style="font-weight:900; font-size:0.95rem; color:#0f172a;">${item.name}</div>
              <div style="font-size:0.8rem; color:#475569;">${item.hint}</div>
            </div>
          </button>
        `;
      }).join('');

      const slotHints = [
        '1º Más grande y antiguo',
        '2º Más pequeño y frío',
        '3º Muchos juntos en pastilla',
        '4º Todo el cerebro en tu dedo'
      ];

      const slotsHTML = state.slots
        .map((item, idx) => {
          let cls = 'slot-item';
          if (item) {
            cls += ' filled';
            if (state.challengeSolved) cls += ' correct';
          }
          return `
            <div class="${cls}" onclick="removeSlotPiece(${idx})">
              <div class="slot-num">${idx + 1}</div>
              ${
                item
                  ? `<div style="display:flex; align-items:center; gap:0.55rem; flex:1;">
                       <span style="font-size:1.4rem;">${item.icon}</span>
                       <div>
                         <div style="font-weight:900; font-size:0.92rem;">${item.name}</div>
                         <div style="font-size:0.75rem; color:#4f46e5;">${state.challengeSolved ? '✅ ¡Correcto!' : 'Toca para quitar'}</div>
                       </div>
                     </div>`
                  : `<span style="font-size:0.86rem; font-weight:700; color:#64748b;">${slotHints[idx]}</span>`
              }
            </div>
          `;
        })
        .join('');

      el.innerHTML = `
        <div class="station-top">
          <div class="station-icon-box" style="background:#fde047;">🏆</div>
          <div>
            <h2>Reto Final: De Cuarto a Bolsillo</h2>
            <div class="station-tagline">Ordena del más grande al más pequeñito</div>
          </div>
        </div>

        <div class="station-content">
          <!-- Teatro de encogimiento -->
          <div class="shrink-timeline-stage">
            <div style="font-size:0.86rem; font-weight:800; color:#38bdf8;">
              🔭 Mira cómo se encoge la computadora:
            </div>
            <div class="size-compare-row">${theaterHTML}</div>
          </div>

          <div class="game-zone">
            <div class="game-zone-title">1️⃣ Toca las piezas en orden:</div>
            <div class="order-list-btns">${choicesHTML}</div>

            <div class="game-zone-title" style="margin-top:0.5rem;">2️⃣ Tu fila (Grande ➡️ Pequeño):</div>
            ${slotsHTML}

            <div class="btn-row">
              <button class="btn-touch green" onclick="verifyTimelineOrder()">✅ Comprobar</button>
              <button class="btn-touch slate" onclick="resetTimelineChallenge()">🔄 Reiniciar</button>
            </div>

            ${
              state.challengeFeedback
                ? `<div class="feedback-pill" style="border-left-color:#ef4444; background:#fee2e2; color:#991b1b; margin-top:0.75rem;">
                     ${state.challengeFeedback}
                   </div>`
                : ''
            }

            ${
              state.challengeSolved
                ? `<div class="victory-card">
                     <div style="font-size:3rem; margin-bottom:0.25rem;">🥇🎉</div>
                     <h3 style="font-size:1.3rem; font-weight:900; color:#14532d; margin-bottom:0.35rem;">
                       ¡Misión Cumplida, Súper Inventor!
                     </h3>
                     <p style="font-size:0.92rem; line-height:1.45; color:#1e293b; margin-bottom:0.85rem;">
                       ¡Ya conoces toda la historia! Pasamos del <strong>Tubo de Vacío</strong> (foco gigante caliente) al <strong>Transistor</strong> (llave chiquita), luego al <strong>Circuito Integrado</strong> (ciudad en pastilla) y finalmente al <strong>Microprocesador</strong> (todo el cerebro en tu dedo).
                     </p>
                     <button class="btn-touch full" onclick="resetTimelineChallenge(); goToStep(0);">
                       🚀 Jugar toda la misión otra vez
                     </button>
                   </div>`
                : ''
            }
          </div>
        </div>
      `;
    }

    function spawnConfetti() {
      const colors = ['#facc15', '#22c55e', '#38bdf8', '#ec4899', '#a855f7', '#fb923c'];
      for (let i = 0; i < 42; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[i % colors.length];
        el.style.animationDelay = Math.random() * 0.7 + 's';
        el.style.borderRadius = i % 2 === 0 ? '50%' : '3px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3500);
      }
    }

    /* ==========================================================================
       RENDER PRINCIPAL
       ========================================================================== */
    function render() {
      updateNavTabs();
      const view = document.getElementById('station-view');
      if (state.step === 0) renderStation1(view);
      else if (state.step === 1) renderStation2(view);
      else if (state.step === 2) renderStation3(view);
      else if (state.step === 3) renderStation4(view);
      else renderFinalChallenge(view);
    }

    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
